# A version tag (v0.9.x) builds both Linux release archives on native x86_64
# and arm64 runners and attaches them, with install.sh, to a DRAFT release.
# Nothing is signed here: the owner downloads the archives, runs
# src/release-sign.sh with the release key on their own machine, uploads
# SHA256SUMS and SHA256SUMS.sig, and publishes (docs/07-setup.md#simple-install).
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: The tag names the checked-in version, on a commit of main
        run: |
          test "v$(cat src/internal/version/VERSION)" = "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Dependencies
        run: |
          bun install --frozen-lockfile --cwd src/mcp
          bun install --frozen-lockfile --cwd src/clients/typescript
          bun install --frozen-lockfile --cwd src/web
      - name: Archives
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: src/package.sh "$PWD/dist"
      - name: Archive hashes, for the owner to compare before signing
        run: (cd dist && sha256sum *.tar.gz) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-${{ matrix.runner }}
          path: dist/*.tar.gz
  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release, unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum *.tar.gz) | tee -a "$GITHUB_STEP_SUMMARY"
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "agent-bus ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned draft: the owner signs SHA256SUMS before publishing." \
            dist/*.tar.gz install.sh
