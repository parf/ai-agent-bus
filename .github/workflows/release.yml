# A version tag builds both editions for Linux and macOS on both CPUs.
# Publish the checked archives and SHA256SUMS as the npm wrapping source.
# Actions are pinned to commits: each SHA is what `git ls-remote` gave for the
# named tag on 2026-10-29. Moving one is a reviewed change, by hand or by a
# dependency bot, never a floating tag.
name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: The tag names the checked-in version, on a commit of main
        run: |
          test "v$(cat src/internal/version/VERSION)" = "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Dependencies
        run: |
          bun install --frozen-lockfile --cwd src/mcp
          bun install --frozen-lockfile --cwd src/clients/typescript
          bun install --frozen-lockfile --cwd src/web
      - name: Archives
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: src/package.sh "$PWD/dist"
      - name: Verify every archive before upload and release creation
        id: release-evidence
        shell: bash
        run: |
          arch=$(uname -m)
          version=$(tr -d '[:space:]' < src/internal/version/VERSION)
          for edition in agent-bus agent-bus-client; do
            expected="dist/$edition-$version-linux-$arch.tar.gz"
            test -f "$expected" || { echo "missing expected archive: $expected" >&2; exit 1; }
          done
          src/release-verify.sh dist/*.tar.gz
      - name: Archive hashes
        run: (cd dist && sha256sum *.tar.gz) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-${{ matrix.runner }}
          path: dist/*.tar.gz
  darwin:
    strategy:
      matrix:
        include:
          - goarch: arm64
            archivearch: aarch64
          - goarch: amd64
            archivearch: x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: src/go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: The tag names the checked-in version, on a commit of main
        run: |
          test "v$(cat src/internal/version/VERSION)" = "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Dependencies
        run: |
          bun install --frozen-lockfile --cwd src/mcp
          bun install --frozen-lockfile --cwd src/clients/typescript
          bun install --frozen-lockfile --cwd src/web
      - name: Cross-build stamped macOS full and client archives
        env:
          BUILD_COMMIT: ${{ github.sha }}
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: src/package.sh "$PWD/dist"
      - name: Verify both macOS editions before upload
        shell: bash
        env:
          ARCHIVE_ARCH: ${{ matrix.archivearch }}
        run: |
          version=$(tr -d '[:space:]' < src/internal/version/VERSION)
          for edition in agent-bus agent-bus-client; do
            expected="dist/$edition-$version-darwin-$ARCHIVE_ARCH.tar.gz"
            test -f "$expected" || { echo "missing expected archive: $expected" >&2; exit 1; }
          done
          src/release-verify.sh dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archives-darwin-${{ matrix.goarch }}
          path: dist/*.tar.gz
  release:
    needs: [build, darwin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish checked build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          src/release-verify.sh --os "linux darwin" dist
          version=$(tr -d '[:space:]' < src/internal/version/VERSION)
          for arch in x86_64 aarch64; do
            src/npm-pack.sh "dist/agent-bus-$version-linux-$arch.tar.gz" \
              "dist/agent-bus-client-$version-linux-$arch.tar.gz" dist/SHA256SUMS npm-dist \
              --darwin-client "dist/agent-bus-client-$version-darwin-aarch64.tar.gz" \
              --darwin-client "dist/agent-bus-client-$version-darwin-x86_64.tar.gz"
          done
          test -f "npm-dist/ai-agent-bus-client-darwin-arm64-$version.tgz"
          test -f "npm-dist/ai-agent-bus-client-darwin-x64-$version.tgz"
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "agent-bus ${GITHUB_REF_NAME#v}" \
            --notes "Release binaries and SHA256SUMS for npm packaging." \
            dist/*.tar.gz dist/SHA256SUMS npm-dist/*.tgz
