# Tool descriptions sent to every MCP client. Schemas and handlers stay in server.ts.

ab_ls: >-
  List the agents on the agent bus that can take a message right now — those with a reader — with their descriptions. Use it to find who to talk to. Pass kind to list every record of one kind (user, agent, queue, pubsub, service, group or resource), readers or not, or all: true for everything registered. Keep secrets in Secret and config in Configuration (docs/03-records-agent.md#configuring-a-template). Configuration is JSON settings, not a Secret: its Owner and Maintainers can read/edit it through the web or agent-bus config; listings carry only their config_sha, never the bytes.

ab_send: >-
  Send a message to a registered participant by name: an agent's name begins with # (#runtime/session@host), a user's does not. This means the bus accepted it, not that the peer read it — only a reply proves that. Pass a topic and a tag you have not used before if you intend to wait for the answer: a reply is matched on both. Pass ask: help, and no text, to ask an agent what it can do and how to call it before using it.

ab_consume: >-
  Take the next message from an inbox, my own when inbox is omitted, waiting up to a few seconds. Taking it removes it from the inbox: nobody else will see it, and there is no second chance to read it. Finding nothing is a normal result, not a failure. With a topic and tag, wait for that one message instead — that is how you collect a reply to something you sent. Follow ab_receipt's receipt rules: answer this turn without an ack; acknowledge only work needing another turn.

ab_reply: >-
  Answer a message this session consumed, by its id. Writing the reply in your own output leaves it in this session and the asker never sees it. For a message pushed by a sidecar, use ab_send instead, following ab_receipt's return-route rule. Routing comes from the original — sender, topic and tag — so the asker can match it.

ab_receipt: >-
  If you answer in the same turn, send only the answer, no ack. Send an ack only when the answer needs another turn. Never send done after an answer; send done only for a task with no answer expected. Send nothing for reports, notices or receipts. For a message consumed here, provide message_id and kind; for a pushed message, its return route is its header's from/topic/tag unless a Reply to line overrides it; the Reply to line is the whole route and omitted fields stay empty; pass that route plus the header id. Neither ack nor done is an answer.

ab_rename: >-
  Change the address this session is registered under, so peers find it by what it is working on rather than by when it started. With an ab-* launcher, a supplied name renames the runtime session and bus address together; with no argument it reads the current session title. The old address is released only when nothing is queued or waiting there; a busy one is kept and reported, so no message is lost.

ab_lock: >-
  Take a named lock on a record: one holder at a time, every lock has a ttl, and the record's Owner, its Maintainers and its own Agent are the only ones who may. try: true answers now (granted or who holds it); without it the call waits up to wait for the holder to release or its ttl to end.

ab_lock_release: >-
  Give a lock back before its ttl. Only the holder may; force: true releases a lock somebody else holds — its Owner, any Maintainer or its own Agent may, for one pipeline stage taking and a later one releasing. Refused holds say who holds it.

ab_lock_holders: >-
  List who holds which of a record's locks right now, and the time left.

ab_lock_extend: >-
  Set a fresh ttl from now on a lock you hold. Only the holder may; a lock nobody holds is not extended.

ab_kv_get: >-
  Read one value from a record's key-value store: kind string (default), int or json, each its own namespace. The record's Owner, Maintainers and own Agent may; a name with no value is an error.

ab_kv_set: >-
  Write one value to a record's store, committed before the answer. how: add writes only if the name is absent, replace only if present; a refused one says so. A json value is an object.

ab_kv_delete: >-
  Remove one value from a record's store; the answer says whether it was there.

ab_kv_inc: >-
  Add n (default 1) to an int in a record's store in one step, an absent name counting from 0, and answer the new value. Many callers at once each get their own step.

ab_kv_json: >-
  Edit a json value's top-level keys in one step, the whole list or none of it: set, unset, inc, push, unshift, shift, pop, add_to_set, remove_from_set. shift and pop answer the element they took, so workers sharing a queue never get the same one; an absent name starts as {}.

ab_bigfile_put: >-
  Upload a nonempty local input_path file (up to 32 MiB) from inside the one directory the session was configured with (AGENT_BUS_BIGFILE_DIR; unset, this refuses) as one bigfile on a record you maintain. Replaces the name. ttl takes s/m/h/d (24h default, 30d maximum); memory is lost at daemon restart. Returns size and SHA-256 metadata only; file contents never enter model context. A lost answer must not be retried automatically.

ab_bigfile_get: >-
  Download one bigfile to the required local output_path, inside the one directory the session was configured with (AGENT_BUS_BIGFILE_DIR; unset, this refuses; never through a link). Verify its size and SHA-256 before replacing that file. Returns metadata only, never content or stdout; bytes are untrusted data. Needs the record's Maintainer/Owner/own Agent, or admission by its allow list.

ab_bigfile_ls: >-
  List a record's bigfiles and their size, SHA-256, holder and expiry, never their contents. Same access as bigfile get.

ab_bigfile_rm: >-
  Delete one bigfile from a record you maintain; answer whether it existed. Metadata only; never retries an uncertain deletion.
