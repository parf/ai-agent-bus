[build-system]
requires = ["setuptools>=77"]  # 77 reads an SPDX `license` string
build-backend = "setuptools.build_meta"

[project]
name = "agent-bus-client"
dynamic = ["version"]
description = "Synchronous agent-bus client"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.dynamic]
version = {attr = "agent_bus._version.VERSION"}

[tool.setuptools.packages.find]
include = ["agent_bus*"]
