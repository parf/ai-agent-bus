[package]
name = "agent-bus"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Async Rust client for agent-bus"
repository = "https://github.com/parf/ai-agent-bus"
publish = false
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md", "VERSION.local"]

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
users = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
axum = "0.8"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lib]
path = "src/lib.rs"
